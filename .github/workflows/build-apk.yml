name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag yang berisi source zip"
        required: true
      build_type:
        description: "debug atau release"
        required: true
        default: "release"

permissions:
  contents: read
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      type: ${{ steps.locate.outputs.type }}
      dir: ${{ steps.locate.outputs.dir }}
      versions: ${{ steps.pick.outputs.versions }}
    steps:
      - name: Download source zip dari release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh release download "${{ github.event.inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --dir source

      - name: Extract project
        run: |
          set -euo pipefail
          mkdir -p project
          cd source
          ZIPFILE=$(ls -- *.zip | head -n1)
          if [ -z "$ZIPFILE" ]; then
            echo "::error::Tidak ada file .zip di dalam release ini."
            exit 1
          fi
          set +e
          unzip -q "$ZIPFILE" -d ../project
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "::error::unzip gagal dengan exit code $status"
            exit "$status"
          fi

      - name: Fix permissions setelah extract
        run: |
          set -euo pipefail
          chmod -R a+rX project

      # Urutan deteksi penting: cek marker paling spesifik dulu supaya
      # tidak salah tebak (mis. project Ionic juga punya package.json
      # sama seperti Capacitor/React Native/Cordova).
      - name: Deteksi jenis project
        id: locate
        run: |
          set -euo pipefail

          # 1. Smali / APKTool -> ditandai file apktool.yml hasil decompile
          APKTOOL_DIR=$(find project -maxdepth 6 -iname "apktool.yml" -printf '%d\t%h\n' | sort -n | cut -f2 | head -n1)
          if [ -n "$APKTOOL_DIR" ]; then
            echo "type=smali" >> "$GITHUB_OUTPUT"
            echo "dir=$APKTOOL_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Flutter -> pubspec.yaml
          PUBSPEC_DIR=$(find project -maxdepth 6 -iname "pubspec.yaml" -printf '%d\t%h\n' | sort -n | cut -f2 | head -n1)
          if [ -n "$PUBSPEC_DIR" ]; then
            echo "type=flutter" >> "$GITHUB_OUTPUT"
            echo "dir=$PUBSPEC_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Project berbasis Node: Cordova / Ionic / Capacitor / React Native
          # dibedakan lewat isi package.json + file konfigurasi khasnya.
          PKG_DIR=$(find project -maxdepth 4 -iname "package.json" -printf '%d\t%h\n' | sort -n | cut -f2 | head -n1)
          if [ -n "$PKG_DIR" ]; then
            PKG="$PKG_DIR/package.json"

            if [ -f "$PKG_DIR/config.xml" ] || grep -q '"cordova"' "$PKG"; then
              echo "type=cordova" >> "$GITHUB_OUTPUT"
              echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ -f "$PKG_DIR/ionic.config.json" ] || grep -qE '"@ionic/(angular|react|vue|core)"' "$PKG"; then
              echo "type=ionic" >> "$GITHUB_OUTPUT"
              echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ -f "$PKG_DIR/capacitor.config.json" ] || [ -f "$PKG_DIR/capacitor.config.ts" ] || grep -q '"@capacitor/core"' "$PKG"; then
              echo "type=capacitor" >> "$GITHUB_OUTPUT"
              echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if grep -q '"react-native"' "$PKG"; then
              echo "type=react-native" >> "$GITHUB_OUTPUT"
              echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # 4. Native Android murni (gradlew tanpa layer JS/Flutter di atasnya)
          GRADLEW_DIR=$(find project -maxdepth 5 -iname "gradlew" -printf '%d\t%h\n' | sort -n | cut -f2 | head -n1)
          if [ -n "$GRADLEW_DIR" ]; then
            echo "type=native" >> "$GITHUB_OUTPUT"
            echo "dir=$GRADLEW_DIR" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Jenis project tidak dikenali. Pastikan zip berisi salah satu: Flutter (pubspec.yaml), Android Native (gradlew), Smali/APKTool (apktool.yml), atau React Native/Ionic/Capacitor/Cordova (package.json)."
          exit 1

      # Auto-detect versi Flutter dari constraint di pubspec.yaml (hanya
      # relevan untuk type=flutter). Untuk jenis lain, cukup 1 build "default".
      - name: Tentukan versi build yang dipakai
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ steps.locate.outputs.type }}" != "flutter" ]; then
            echo 'versions=["default"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PUBSPEC="${{ steps.locate.outputs.dir }}/pubspec.yaml"
          EXACT=$(grep -E "^\s*flutter:\s*[\"']?[0-9]+\.[0-9]+\.[0-9]+[\"']?\s*$" "$PUBSPEC" \
            | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -n1 || true)

          if [ -n "$EXACT" ]; then
            echo "Ditemukan versi Flutter exact di pubspec.yaml: $EXACT"
            echo "versions=[\"$EXACT\"]" >> "$GITHUB_OUTPUT"
          else
            echo "Tidak ada versi Flutter exact di pubspec.yaml, build otomatis: stable + 3.41.6"
            echo 'versions=["stable","3.41.6"]' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload project sebagai artifact sementara
        uses: actions/upload-artifact@v4
        with:
          name: project-source
          path: project
          retention-days: 1
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        build_version: ${{ fromJson(needs.prepare.outputs.versions) }}
    steps:
      - name: Download project dari artifact
        uses: actions/download-artifact@v4
        with:
          name: project-source
          path: project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Node.js
        if: contains(fromJson('["react-native","ionic","capacitor","cordova"]'), needs.prepare.outputs.type)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Flutter
        if: needs.prepare.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.build_version != 'stable' && matrix.build_version || '' }}
          cache: true

      # ---------- FLUTTER ----------
      - name: Flutter pub get
        if: needs.prepare.outputs.type == 'flutter'
        working-directory: ${{ needs.prepare.outputs.dir }}
        run: flutter pub get

      - name: Build APK - Flutter (debug)
        if: needs.prepare.outputs.type == 'flutter' && github.event.inputs.build_type == 'debug'
        working-directory: ${{ needs.prepare.outputs.dir }}
        run: flutter build apk --debug

      - name: Build APK - Flutter (release)
        if: needs.prepare.outputs.type == 'flutter' && github.event.inputs.build_type != 'debug'
        working-directory: ${{ needs.prepare.outputs.dir }}
        run: flutter build apk --release --no-tree-shake-icons

      # ---------- ANDROID NATIVE ----------
      - name: Build APK - Native Gradle (debug)
        if: needs.prepare.outputs.type == 'native' && github.event.inputs.build_type == 'debug'
        working-directory: ${{ needs.prepare.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build APK - Native Gradle (release)
        if: needs.prepare.outputs.type == 'native' && github.event.inputs.build_type != 'debug'
        working-directory: ${{ needs.prepare.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # ---------- REACT NATIVE ----------
      - name: Install dependencies (React Native)
        if: needs.prepare.outputs.type == 'react-native'
        working-directory: ${{ needs.prepare.outputs.dir }}
        run: npm install

      - name: Build APK - React Native (debug)
        if: needs.prepare.outputs.type == 'react-native' && github.event.inputs.build_type == 'debug'
        working-directory: ${{ needs.prepare.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build APK - React Native (release)
        if: needs.prepare.outputs.type == 'react-native' && github.event.inputs.build_type != 'debug'
        working-directory: ${{ needs.prepare.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # ---------- CAPACITOR ----------
      - name: Install dependencies (Capacitor)
        if: needs.prepare.outputs.type == 'capacitor'
        working-directory: ${{ needs.prepare.outputs.dir }}
        run: |
          npm install
          npm run build || true
          npx cap sync android

      - name: Build APK - Capacitor (debug)
        if: needs.prepare.outputs.type == 'capacitor' && github.event.inputs.build_type == 'debug'
        working-directory: ${{ needs.prepare.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build APK - Capacitor (release)
        if: needs.prepare.outputs.type == 'capacitor' && github.event.inputs.build_type != 'debug'
        working-directory: ${{ needs.prepare.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # ---------- IONIC (asumsi native layer = Capacitor) ----------
      - name: Install dependencies (Ionic)
        if: needs.prepare.outputs.type == 'ionic'
        working-directory: ${{ needs.prepare.outputs.dir }}
        run: |
          npm install
          npm run build || true
          npx cap sync android

      - name: Build APK - Ionic (debug)
        if: needs.prepare.outputs.type == 'ionic' && github.event.inputs.build_type == 'debug'
        working-directory: ${{ needs.prepare.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build APK - Ionic (release)
        if: needs.prepare.outputs.type == 'ionic' && github.event.inputs.build_type != 'debug'
        working-directory: ${{ needs.prepare.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # ---------- CORDOVA ----------
      - name: Install dependencies (Cordova)
        if: needs.prepare.outputs.type == 'cordova'
        working-directory: ${{ needs.prepare.outputs.dir }}
        run: |
          npm install
          npm install -g cordova
          cordova platform add android || true

      - name: Build APK - Cordova (debug)
        if: needs.prepare.outputs.type == 'cordova' && github.event.inputs.build_type == 'debug'
        working-directory: ${{ needs.prepare.outputs.dir }}
        run: cordova build android --debug

      - name: Build APK - Cordova (release)
        if: needs.prepare.outputs.type == 'cordova' && github.event.inputs.build_type != 'debug'
        working-directory: ${{ needs.prepare.outputs.dir }}
        run: cordova build android --release

      # ---------- SMALI / APKTOOL ----------
      - name: Install APKTool
        if: needs.prepare.outputs.type == 'smali'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y apktool || (
            sudo wget -q -O /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
            sudo wget -q -O /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/latest/download/apktool.jar
            sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          )

      - name: Build APK - Smali/APKTool (rebuild + sign debug key)
        if: needs.prepare.outputs.type == 'smali'
        run: |
          set -euo pipefail
          apktool b "${{ needs.prepare.outputs.dir }}" -o unsigned.apk

          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          "${BUILD_TOOLS}zipalign" -v -p 4 unsigned.apk aligned.apk
          "${BUILD_TOOLS}apksigner" sign \
            --ks debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey \
            --out final-smali.apk aligned.apk

      # ---------- CARI HASIL APK ----------
      - name: Cari file APK hasil build
        id: apk
        run: |
          set -euo pipefail
          TYPE="${{ needs.prepare.outputs.type }}"
          DIR="${{ needs.prepare.outputs.dir }}"
          APK_PATH=""

          case "$TYPE" in
            smali)
              APK_PATH="final-smali.apk"
              ;;
            cordova)
              APK_PATH=$(find "$DIR/platforms/android" -path "*/outputs/*apk*" -name "*.apk" 2>/dev/null | head -n1)
              ;;
            react-native|capacitor|ionic)
              APK_PATH=$(find "$DIR/android" -path "*/outputs/*apk*" -name "*.apk" 2>/dev/null | head -n1)
              ;;
            *)
              APK_PATH=$(find "$DIR" -path "*/outputs/*apk*" -name "*.apk" 2>/dev/null | head -n1)
              ;;
          esac

          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" 2>/dev/null | grep -v "/source/" | head -n1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "::error::File APK hasil build tidak ditemukan!"
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-apk-${{ matrix.build_version }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 1
          if-no-files-found: error

  finalize:
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Download semua APK hasil build (per versi)
        uses: actions/download-artifact@v4
        with:
          pattern: built-apk-*
          path: all-apks
        continue-on-error: true

      - name: Pilih satu APK yang berhasil dibuild
        id: choose
        run: |
          set -euo pipefail
          CHOSEN=""
          CHOSEN_NAME=""

          if [ -d "all-apks/built-apk-stable" ]; then
            APK=$(find "all-apks/built-apk-stable" -name "*.apk" | head -n1)
            if [ -n "$APK" ]; then
              CHOSEN="$APK"
              CHOSEN_NAME="built-apk-stable"
            fi
          fi

          if [ -z "$CHOSEN" ] && [ -d "all-apks" ]; then
            for d in all-apks/*/; do
              [ -d "$d" ] || continue
              APK=$(find "$d" -name "*.apk" | head -n1)
              if [ -n "$APK" ]; then
                CHOSEN="$APK"
                CHOSEN_NAME=$(basename "$d")
                break
              fi
            done
          fi

          if [ -z "$CHOSEN" ]; then
            echo "::error::Tidak ada APK yang berhasil dibuild dari versi manapun! Cek log job 'build' untuk detail error tiap versi."
            exit 1
          fi

          echo "Menggunakan hasil build: $CHOSEN_NAME"
          cp "$CHOSEN" ./final.apk
          echo "path=final.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK final (satu-satunya)
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: ${{ steps.choose.outputs.path }}
          retention-days: 1

      - name: Hapus artifact sementara
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name == "project-source" or (.name | startswith("built-apk-"))) | .id' \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
            done
